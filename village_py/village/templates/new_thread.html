{% include 'header.html' %}

<form
    action="/threads/new"
    method="POST"
    enctype="multipart/form-data"
    class="basic-form"
    id="thread-extend-form"
>
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>

    {% if error %}
    <div class="form-error">Error: {{ error }}</div>
    {% endif %}

    <div class="form-group">
        <label for="title" class="form-label">Title:</label>
        <input
            id="title"
            class="form-input"
            type="text"
            name="title"
            value="{{ title }}"
            required
        />
    </div>

    <div class="form-group">
        <label for="image", class="form-label">Image:</label>
        <input
            id="image"
            class="form-input"
            type="file"
            name="image"
            accept="image/*"
        />
    </div>

    <div class="form-group">
        <label for="content", class="form-label">Message:</label>
        <textarea
            id="content"
            name="content"
            class="form-textarea"
            required
        >{{ content|safe }}</textarea>
    </div>

    <div class="form-group">
        <label for="visible", class="form-label">Visible:</label>
        <input
            id="visible"
            class="form-input"
            type="checkbox"
            name="visible"
            checked
        />
    </div>

    <div class="form-actions">
        <button type="submit" class="form-button main-button">Create Thread</button>
    </div>

</form>

{% include 'footer.html' %}
