{% include 'header.html' %}

<form
    action="/posts/{{ post_id }}/delete"
    method="POST"
    enctype="multipart/form-data"
    class="basic-form"
    id="post-delete-confirmation"
>
    {% if error %}
    <div class="form-error">Error: {{ error }}</div>
    {% endif %}

    <h1>Warning</h1>
    <p>Once the post is deleted, it cannot be recovered.</p>

    <input
        id="confirmed"
        type="hidden"
        name="confirmed"
        value="confirmed"
    />

    <div class="form-actions">
        <button type="submit" class="main-button">Confirm</button>
    </div>

</form>

{% include 'footer.html' %}
