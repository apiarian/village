{% include 'header.html' %}

<h1>Posts</h1>
<p><a href="/posts/new">Write a new post</a>.</p>
<p>
  <ul>
    {% for post in posts %}
    <li>
      <a href="/posts/{{ post.id }}">
        {{ post.title }}
      </a>
    </li>
    {% endfor %}
  </ul>
</p>
<h2>Hidden Posts</h2>
<p>
  <ul>
    {% for post in hidden_posts %}
    <li>
      <a href="/posts/{{ post.id }}">
        {{ post.title }}
      </a>
    </li>
    {% endfor %}
  </ul>
</p>


{% include 'footer.html' %}
