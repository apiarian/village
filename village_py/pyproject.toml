[tool.poetry]
name = "village"
version = "0.1.0"
description = "A basic server backing the village project."
authors = ["Aleksandr Pasechnik <al@megamicron.net>"]
license = "The Unlicense"
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.11"
flask = "^3.0.2"
pydantic = "^2.6.4"
pyyaml = "^6.0.1"
pillow = "^10.3.0"
gunicorn = {extras = ["gevent"], version = "^23.0.0"}
requests = "^2.32.3"
flask-wtf = "^1.2.2"
icalendar = "^6.1.3"
pytest = "^9.0.2"
flask-limiter = "^4.1.1"
flask-session = {extras = ["cachelib"], version = "^0.8.0"}


[tool.poetry.group.dev.dependencies]
mypy = "^1.9.0"
black = "^24.3.0"
types-pyyaml = "^6.0.12.20240311"
types-markdown = "^3.6.0.20240316"
types-bleach = "^6.1.0.20240331"
isort = "^5.13.2"
ipython = "^8.23.0"
types-requests = "^2.32.0.20241016"
types-icalendar = "^6.1.3.20250403"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
initialize-repository = "village.scripts.initialize_repository:main"
create-user = "village.scripts.create_user:main"
force-reset-password = "village.scripts.force_reset_password:main"
update-thumbnail = "village.scripts.update_thumbnail:main"
